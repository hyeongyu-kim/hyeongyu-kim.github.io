name: Record public-code TTA remainder
on:
  push:
    branches: [codex/tta-public-implementations]
    paths:
      - .github/workflows/tta-record-remainder.yml
      - _scripts/record_tta_condition.py
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.3.5 Pillow==12.3.0 pyarrow==25.0.1 gdown==6.4.2
      - run: python _scripts/fetch_tta_data.py --mirror
      - uses: actions/upload-artifact@v4
        with:
          name: tta-prepared-data
          path: |
            ../tta-data/*.npy
            ../tta-data/Standard.pt
            ../tta-data/provenance.json
          retention-days: 1
  record:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        condition:
          - batch-128-gaussian_noise-3
          - batch-128-gaussian_noise-5
          - batch-128-brightness-1
          - batch-128-brightness-3
          - batch-128-brightness-5
          - batch-128-defocus_blur-1
          - batch-128-defocus_blur-3
          - batch-128-defocus_blur-5
          - batch-128-jpeg_compression-1
          - batch-128-jpeg_compression-3
          - batch-128-jpeg_compression-5
          - stream-128-continual
          - stream-128-reset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy==2.3.5 Pillow==12.3.0
      - uses: actions/download-artifact@v4
        with:
          name: tta-prepared-data
          path: ../tta-data
      - run: >-
          python _scripts/record_tta_condition.py
          --condition '${{ matrix.condition }}'
          --protocol-sha 23d9e031a103355bf30f96c062a60c553919d68180e0754b852a6468b2ef92f8
          --recorder-sha cedd79bb8796c8b229356df1c753991cd346c3dda44759aeded9f5855d522a6d
          --output ../tta-result
      - uses: actions/upload-artifact@v4
        with:
          name: tta-condition-${{ matrix.condition }}
          path: ../tta-result/*
          retention-days: 1
  collect:
    needs: record
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: tta-condition-*
          path: ../tta-merged
          merge-multiple: true
      - name: Verify and commit only completed data to the work branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python - <<'PY'
          import hashlib,json,pathlib,shutil
          root=pathlib.Path('../tta-merged')
          receipts=[]
          for receipt_file in sorted(root.glob('*-receipt.json')):
              receipt=json.loads(receipt_file.read_text())
              source=root/receipt['file']
              assert hashlib.sha256(source.read_bytes()).hexdigest()==receipt['sha256']
              assert receipt['recordingProtocolSha256']=='23d9e031a103355bf30f96c062a60c553919d68180e0754b852a6468b2ef92f8'
              assert receipt['recorderSourceSha256']=='cedd79bb8796c8b229356df1c753991cd346c3dda44759aeded9f5855d522a6d'
              shutil.copyfile(source,pathlib.Path('assets/lab/tta')/receipt['file'])
              receipts.append(receipt)
          assert len(receipts)==13
          pathlib.Path('assets/lab/tta-worker-receipts.json').write_text(json.dumps(receipts,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/lab/tta/batch-128-*.json.gz assets/lab/tta/stream-128-*.json.gz assets/lab/tta-worker-receipts.json
          git commit -m 'chore: record remaining WRN conditions from pinned public implementations'
          git push origin HEAD:${{ github.ref_name }}
